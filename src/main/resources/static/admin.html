<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveXpress | Admin Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .panel-header { border-left: 5px solid #0d6efd; padding-left: 10px; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#"><i class="fa-solid fa-gauge me-2"></i>DriveXpress Admin</a>
            <span class="navbar-text text-white-50">Fleet Management Control Center</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="panel-header fw-bold text-dark mb-4">Add New Fleet Vehicle</h4>
                        <form id="vehicleForm">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Brand Manufacturer</label>
                                <input type="text" id="brand" class="form-control" placeholder="e.g. Mahindra" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Model Name</label>
                                <input type="text" id="modelName" class="form-control" placeholder="e.g. Thar" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Operational Hub Location</label>
                                <input type="text" id="hubLocation" class="form-control" placeholder="e.g. Ahmedabad" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Price Per Day (₹)</label>
                                <input type="number" id="pricePerDay" class="form-control" placeholder="e.g. 3500" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Vehicle Class Segment</label>
                                <select id="vehicleType" class="form-select">
                                    <option value="SUV">SUV</option>
                                    <option value="Sedan">Sedan</option>
                                    <option value="Hatchback">Hatchback</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Transmission System</label>
                                <select id="transmission" class="form-select">
                                    <option value="Manual">Manual</option>
                                    <option value="Automatic">Automatic</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Fuel Configuration</label>
                                <select id="fuelType" class="form-select">
                                    <option value="Petrol">Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="EV">EV</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Showroom Asset Image URL</label>
                                <input type="text" id="imageUrl" class="form-control" placeholder="https://example.com/car.jpg">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Deploy Vehicle Asset</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="panel-header fw-bold text-dark mb-4">Active Fleet Inventory Pipeline</h4>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Asset ID</th>
                                        <th>Vehicle Spec</th>
                                        <th>Current Station Hub</th>
                                        <th>Base Rate</th>
                                        <th>Lifecycle Status</th>
                                        <th class="text-center" style="min-width: 180px;">Management Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="adminTableBody">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const URL = window.location.origin + '/api/vehicles';

        document.addEventListener("DOMContentLoaded", loadAdminWorkspace);
        document.getElementById('vehicleForm').addEventListener('submit', addVehicle);

        async function loadAdminWorkspace() {
            try {
                const res = await fetch(URL);
                const cars = await res.json();
                renderAdminTable(cars);
            } catch (err) { console.error("Failed to load backend fleet pipeline", err); }
        }

        function renderAdminTable(cars) {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            cars.forEach(car => {
                let badgeStyle = "bg-success";
                if(car.status === "RENTED") badgeStyle = "bg-danger";
                if(car.status === "UNDER_REVIEW") badgeStyle = "bg-warning text-dark";
                if(car.status === "MAINTENANCE") badgeStyle = "bg-secondary";

                let actionButtons = '';
                
                // State 1: Vehicle is undergoing review after being returned by user
                if (car.status === "UNDER_REVIEW") {
                    actionButtons = `
                        <button onclick="processInspection(${car.id}, 'AVAILABLE')" class="btn btn-sm btn-success me-1" title="Accept Return & Make Available">
                            <i class="fa-solid fa-check"></i> Accept
                        </button>
                        <button onclick="processInspection(${car.id}, 'MAINTENANCE')" class="btn btn-sm btn-outline-warning text-dark me-1" title="Reject Return (Send to Maintenance)">
                            <i class="fa-solid fa-triangle-exclamation"></i> Reject
                        </button>
                    `;
                } 
                // State 2: Vehicle is grounded in maintenance and needs recovery back to fleet
                else if (car.status === "MAINTENANCE") {
                    actionButtons = `
                        <button onclick="processInspection(${car.id}, 'AVAILABLE')" class="btn btn-sm btn-outline-success me-1" title="Repairs Complete - Put Back on Showroom">
                            <i class="fa-solid fa-wrenchme-1"></i> Fix Done
                        </button>
                    `;
                }

                // Add standard permanent decommissioning option (Trash Can)
                actionButtons += `
                    <button onclick="deleteVehicle(${car.id})" class="btn btn-sm btn-outline-danger" title="Decommission Asset">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;

                tbody.innerHTML += `
                    <tr>
                        <td><b>#${car.id}</b></td>
                        <td>
                            <div class="fw-bold">${car.brand} ${car.modelName}</div>
                            <small class="text-secondary text-uppercase">${car.vehicleType} • ${car.transmission} • ${car.fuelType}</small>
                        </td>
                        <td><i class="fa-solid fa-location-dot text-danger me-1"></i><b>${car.currentHubLocation}</b></td>
                        <td>₹${car.pricePerDay}/day</td>
                        <td><span class="badge ${badgeStyle}">${car.status}</span></td>
                        <td class="text-center">${actionButtons}</td>
                    </tr>`;
            });
        }

        // Inspection Management Logic: Changes status without wiping remaining vehicle info
        async function processInspection(id, newStatus) {
            try {
                const res = await fetch(URL);
                const cars = await res.json();
                const car = cars.find(c => c.id === id);
                
                if (!car) return;

                car.status = newStatus;

                await fetch(URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(car)
                });

                loadAdminWorkspace();
            } catch (err) {
                console.error("Failed to alter inspection lifecycle status", err);
            }
        }

        async function addVehicle(e) {
            e.preventDefault();
            const vehicleData = {
                brand: document.getElementById('brand').value,
                modelName: document.getElementById('modelName').value,
                currentHubLocation: document.getElementById('hubLocation').value,
                pricePerDay: parseFloat(document.getElementById('pricePerDay').value),
                vehicleType: document.getElementById('vehicleType').value,
                transmission: document.getElementById('transmission').value,
                fuelType: document.getElementById('fuelType').value,
                imageUrl: document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1549399542-7e3f8b79c341?auto=format&fit=crop&w=600&q=80',
                status: 'AVAILABLE'
            };

            await fetch(URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vehicleData)
            });

            document.getElementById('vehicleForm').reset();
            loadAdminWorkspace();
        }

        async function deleteVehicle(id) {
            if(confirm("Are you certain you want to permanently decommission this vehicle asset from service?")) {
                await fetch(`${URL}/${id}`, { method: 'DELETE' });
                loadAdminWorkspace();
            }
        }
    </script>
</body>
</html>
