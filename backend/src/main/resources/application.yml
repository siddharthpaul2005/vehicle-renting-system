spring:
  application:
    name: drivexpress
  # Local secrets live in backend/.env (git-ignored). Real env vars always win.
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/drivexpress}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # Must be at least 32 characters. Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiry-hours: ${JWT_EXPIRY_HOURS:24}
  cors:
    # Comma-separated. Both spellings of the Vite dev server are allowed by default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    enabled: ${SEED_DATA:true}
    # Public demo accounts. Their passwords are re-applied on every start (see DataSeeder).
    admin-email: ${ADMIN_EMAIL:admin@drivexpress.com}
    admin-password: ${ADMIN_PASSWORD:admin1234}
    demo-email: ${DEMO_EMAIL:demo@drivexpress.com}
    demo-password: ${DEMO_PASSWORD:demo1234}
